openapi: 3.0.3
info:
  title: Globetrotter API
  version: LOCAL
  description: API documentation for Globetrotter app
  contact:
    name: Globetrotter
    url: ''
paths:
  /api/user/auth/email/:
    post:
      operationId: user_auth_email_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginEmail'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEmail'
          description: ''
  /api/user/auth/phone/:
    post:
      operationId: user_auth_phone_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginPhone'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginPhone'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginPhone'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginPhone'
          description: ''
  /api/user/auth/refresh/:
    post:
      operationId: user_auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/user/avatar/:
    patch:
      operationId: user_avatar_partial_update
      tags:
      - user
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAvatar'
          '*/*':
            schema:
              $ref: '#/components/schemas/PatchedAvatar'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Avatar'
          description: ''
  /api/user/detail/:
    get:
      operationId: user_detail_retrieve
      tags:
      - user
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
          description: ''
  /api/user/email/verify/request/:
    post:
      operationId: user_email_verify_request_create
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequestSerialiser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequestSerialiser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerifyRequestSerialiser'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerifyRequestSerialiser'
          description: ''
  /api/user/email/verify/submit/:
    post:
      operationId: user_email_verify_submit_create
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerifySubmitSerialiser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerifySubmitSerialiser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerifySubmitSerialiser'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerifySubmitSerialiser'
          description: ''
  /api/user/password/change/:
    post:
      operationId: user_password_change_create
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePassword'
          description: ''
  /api/user/password/forgot/request/:
    post:
      operationId: user_password_forgot_request_create
      description: |-
        Password forgot, request for reset.

        Send verification code to phone number.
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordForgotRequest'
          description: ''
  /api/user/password/forgot/verify/:
    post:
      operationId: user_password_forgot_verify_create
      description: |-
        Password forgot verify phone by code.

        Verification phone number and allow to reset password.
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordForgotVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordForgotVerify'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordForgotVerify'
          description: ''
  /api/user/password/reset/check_code/:
    post:
      operationId: user_password_reset_check_code_create
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckPasswordResetCodeSerialiser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckPasswordResetCodeSerialiser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckPasswordResetCodeSerialiser'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckPasswordResetCodeSerialiser'
          description: ''
  /api/user/password/reset/request/:
    post:
      operationId: user_password_reset_request_create
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetRequest'
          description: ''
  /api/user/password/reset/submit/:
    post:
      operationId: user_password_reset_submit_create
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetSubmitSerialiser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetSubmitSerialiser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetSubmitSerialiser'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetSubmitSerialiser'
          description: ''
  /api/user/registration/email/:
    post:
      operationId: user_registration_email_create
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRegistration'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailRegistration'
          description: ''
  /api/user/registration/phone/:
    post:
      operationId: user_registration_phone_create
      tags:
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhoneRegistration'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PhoneRegistration'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PhoneRegistration'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhoneRegistration'
          description: ''
components:
  schemas:
    Avatar:
      type: object
      properties:
        avatar:
          type: string
          format: uri
          nullable: true
    ChangePassword:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
      required:
      - new_password
      - old_password
    CheckPasswordResetCodeSerialiser:
      type: object
      properties:
        email_candidate:
          type: string
          format: email
          writeOnly: true
        code_candidate:
          type: string
          writeOnly: true
      required:
      - code_candidate
      - email_candidate
    EmailRegistration:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
        detail:
          type: string
          readOnly: true
          default: success
      required:
      - detail
      - email
      - password
    EmailVerifyRequestSerialiser:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    EmailVerifySubmitSerialiser:
      type: object
      properties:
        email:
          type: string
          format: email
        code_candidate:
          type: string
          writeOnly: true
      required:
      - code_candidate
      - email
    LoginEmail:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    LoginPhone:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    PasswordForgotRequest:
      type: object
      properties:
        phone:
          type: string
          writeOnly: true
        detail:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
      required:
      - detail
      - phone
      - status
    PasswordForgotVerify:
      type: object
      properties:
        phone:
          type: string
          writeOnly: true
        code:
          type: string
          writeOnly: true
        detail:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
      required:
      - code
      - detail
      - phone
      - status
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          writeOnly: true
      required:
      - email
    PasswordResetSubmitSerialiser:
      type: object
      properties:
        code_candidate:
          type: string
          writeOnly: true
        password_candidate:
          type: string
          writeOnly: true
      required:
      - code_candidate
      - password_candidate
    PatchedAvatar:
      type: object
      properties:
        avatar:
          type: string
          format: uri
          nullable: true
    PhoneRegistration:
      type: object
      properties:
        phone:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        detail:
          type: string
          readOnly: true
          default: success
      required:
      - detail
      - password
      - phone
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    UserDetail:
      type: object
      properties:
        name:
          type: string
          maxLength: 64
        surname:
          type: string
          maxLength: 64
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          nullable: true
          maxLength: 255
        avatar:
          type: string
          format: uri
          nullable: true
        is_email_verified:
          type: boolean
          title: Is email verified?
        is_phone_verified:
          type: boolean
          title: Is phone verified?
      required:
      - email
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
servers:
- url: http://0.0.0.0
  description: LOCAL
